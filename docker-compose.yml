version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexevent-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/event_management
      - JWT_SECRET=production-secret-change-me-in-env
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongo
    networks:
      - nexevent-network

  mongo:
    image: mongo:7.0
    container_name: nexevent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nexevent-network

volumes:
  mongo-data:

networks:
  nexevent-network:
    driver: bridge
